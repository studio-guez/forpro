name: CI / Deploy

on:
  push:
    branches: [main, preprod]
    tags: ['v*']
  pull_request:
    branches: [main, preprod]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: preprod
        type: choice
        options: [preprod, production]
      services:
        description: 'Services to build (comma-separated: cms,website,restaurant,menu) or "all"'
        required: true
        default: all
        type: string

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the deployment target and the image tags for this run. A single
  # job so every matrix leg and the deploy jobs share the same release id.
  # ---------------------------------------------------------------------------
  meta:
    name: Resolve target & tags
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.meta.outputs.target }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      floating_tag: ${{ steps.meta.outputs.floating_tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Resolve deployment target and tags
        id: meta
        run: |
          SHA7=${GITHUB_SHA::7}
          TS=$(date -u +%Y%m%dT%H%M%SZ)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${GITHUB_REF}" = "refs/heads/preprod" ]; then
            TARGET="preprod"
          else
            TARGET="production"
          fi

          if [ "$TARGET" = "preprod" ]; then
            IMAGE_TAG="preprod-sha-$SHA7"
            FLOATING_TAG="preprod"
          else
            IMAGE_TAG="sha-$SHA7"
            FLOATING_TAG="latest"
          fi

          # Which refs may ship where. Mainly a guard on workflow_dispatch,
          # which can otherwise pick any target from any branch.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            case "$TARGET:$GITHUB_REF" in
              production:refs/heads/main|production:refs/tags/v*) ;;
              preprod:refs/heads/preprod|preprod:refs/heads/main)  ;;
              *)
                echo "::error::Refusing to deploy $GITHUB_REF to $TARGET. production accepts main or v* tags, preprod accepts preprod or main."
                exit 1 ;;
            esac
          fi

          echo "Target: $TARGET · image tag: $IMAGE_TAG · floating tag: $FLOATING_TAG"
          echo "target=$TARGET"             >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG"       >> "$GITHUB_OUTPUT"
          echo "floating_tag=$FLOATING_TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$TS-$SHA7"       >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Detect which services changed so we only test/build/deploy those.
  #
  # The comparison base is NOT the default branch: it is the commit of the last
  # successful run of this workflow on the same branch, i.e. the last commit
  # that actually reached the servers. Anything else would make preprod rebuild
  # its whole divergence from main on every push, and a run that failed before
  # deploying would lose its changes on the next push (its files are still
  # "changed" relative to the last green deploy, so they get rebuilt again).
  #
  # Any change to the deployment plumbing itself rebuilds everything, and so do
  # tag pushes, workflow_dispatch and the first run on a branch (no known base).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.services.outputs.services }}
      services_csv: ${{ steps.services.outputs.services_csv }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve change-detection base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=""

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          elif [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            # Only branch pushes, whose target is a pure function of the branch.
            # Tag pushes and workflow_dispatch can ship a different environment,
            # so counting them would let a production release mark preprod as
            # up to date (and vice versa).
            CANDIDATES=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch="$BRANCH" -f status=success -f event=push -f per_page=50 \
              --jq ".workflow_runs[] | select(.head_branch == \"$BRANCH\") | .head_sha" 2>/dev/null || true)

            # Skip SHAs that were rebased/force-pushed away or are not ancestors
            # of HEAD, otherwise the diff would be meaningless.
            for sha in $CANDIDATES; do
              if [ "$sha" != "$GITHUB_SHA" ] \
                 && git cat-file -e "$sha^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$sha" HEAD; then
                BASE="$sha"
                break
              fi
            done
          fi

          if [ -n "$BASE" ]; then
            echo "Change detection base: $BASE"
          else
            echo "No usable base commit – treating every service as changed."
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Compute service list
        id: services
        env:
          REQUESTED: ${{ inputs.services }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          ALL="cms website restaurant menu"
          SELECTED=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED" = "all" ]; then
              SELECTED="$ALL"
            else
              SELECTED=$(echo "$REQUESTED" | tr ',' ' ')
              for s in $SELECTED; do
                case " $ALL " in
                  *" $s "*) ;;
                  *) echo "Unknown service: $s"; exit 1 ;;
                esac
              done
            fi
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ] || [ -z "$BASE_SHA" ]; then
            SELECTED="$ALL"
          else
            CHANGED=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            echo "Changed files ($(printf '%s\n' "$CHANGED" | grep -c . || true)):"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'

            changed() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }

            if changed '^(compose\.prod\.yml|deploy\.env\.example|\.github/workflows/ci\.yml|\.github/actions/)'; then
              SELECTED="$ALL"
            else
              for s in $ALL; do
                if changed "^$s/"; then SELECTED="$SELECTED $s"; fi
              done
            fi
          fi

          if [ -z "$SELECTED" ]; then
            JSON="[]"
            CSV=""
          else
            JSON=$(printf '%s\n' $SELECTED | jq -R . | jq -cs .)
            CSV=$(echo $SELECTED | tr ' ' ',')
          fi
          echo "Services: $JSON"
          echo "services=$JSON"     >> "$GITHUB_OUTPUT"
          echo "services_csv=$CSV"  >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Per-service checks (PRs and pushes). Runs the same production build the
  # Docker images run, so a red job here means a broken image build.
  # ---------------------------------------------------------------------------
  check:
    name: Check ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      # ── CMS (Kirby / PHP) ──────────────────────────────────────────────────
      - name: Setup PHP 8.4
        if: matrix.service == 'cms'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, gd, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        if: matrix.service == 'cms'
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('cms/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate & install composer dependencies
        if: matrix.service == 'cms'
        working-directory: cms
        run: |
          composer validate --no-check-all --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress

      # ── Frontends (Node / pnpm) ────────────────────────────────────────────
      - name: Setup pnpm
        if: matrix.service != 'cms'
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Setup Node 24
        if: matrix.service != 'cms'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml

      - name: Install dependencies
        if: matrix.service != 'cms'
        working-directory: ${{ matrix.service }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: matrix.service != 'cms'
        working-directory: ${{ matrix.service }}
        env:
          NUXT_TELEMETRY_DISABLED: '1'
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # Build & push one image per changed service. Skipped on pull requests.
  # Frontend images bake their public URLs at build time, so preprod images
  # are built with the PREPROD_* repository variables.
  # ---------------------------------------------------------------------------
  build:
    name: Build & push ${{ matrix.service }}
    needs: [meta, changes, check]
    if: github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build args
        id: args
        env:
          TARGET: ${{ needs.meta.outputs.target }}
          PREPROD_CMS_BASE_URL: ${{ vars.PREPROD_CMS_BASE_URL }}
          PREPROD_MENU_BASE_URL: ${{ vars.PREPROD_MENU_BASE_URL }}
          PRODUCTION_CMS_BASE_URL: ${{ vars.PRODUCTION_CMS_BASE_URL }}
          PRODUCTION_MENU_BASE_URL: ${{ vars.PRODUCTION_MENU_BASE_URL }}
        run: |
          set -euo pipefail

          # Public URLs are baked into the frontend bundles at build time, so a
          # missing variable must fail rather than fall back to another
          # environment's URL.
          CMS_URL=""
          MENU_URL=""
          case "$TARGET" in
            preprod)
              CMS_URL="$PREPROD_CMS_BASE_URL"
              MENU_URL="$PREPROD_MENU_BASE_URL" ;;
            production)
              CMS_URL="$PRODUCTION_CMS_BASE_URL"
              MENU_URL="$PRODUCTION_MENU_BASE_URL" ;;
          esac

          PREFIX=$(echo "$TARGET" | tr '[:lower:]' '[:upper:]')
          if [ -z "$CMS_URL" ] || [ -z "$MENU_URL" ]; then
            echo "::error::Set the ${PREFIX}_CMS_BASE_URL and ${PREFIX}_MENU_BASE_URL repository variables before deploying to $TARGET."
            exit 1
          fi
          if [ "$TARGET" = "preprod" ] \
             && { [ "$CMS_URL" = "$PRODUCTION_CMS_BASE_URL" ] || [ "$MENU_URL" = "$PRODUCTION_MENU_BASE_URL" ]; }; then
            echo "::warning::A preprod image is being built against a production URL ($CMS_URL / $MENU_URL)."
          fi

          echo "$TARGET → CMS $CMS_URL · MENU $MENU_URL"

          {
            echo "list<<EOF"
            case "${{ matrix.service }}" in
              website)
                echo "PUBLIC_CMS_BASE_URL=$CMS_URL"
                ;;
              restaurant)
                echo "PUBLIC_CMS_BASE_URL=$CMS_URL"
                echo "PUBLIC_MENU_BASE_URL=$MENU_URL"
                ;;
              menu)
                echo "NUXT_PUBLIC_CMS_BASE_URL=$CMS_URL"
                ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile.prod
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ needs.meta.outputs.image_tag }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ needs.meta.outputs.floating_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ needs.meta.outputs.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ needs.meta.outputs.target }}
          build-args: ${{ steps.args.outputs.list }}

  # ---------------------------------------------------------------------------
  # Preprod deploy.
  # ---------------------------------------------------------------------------
  deploy-preprod:
    name: Deploy to preproduction
    needs: [meta, changes, build]
    if: needs.meta.outputs.target == 'preprod'
    runs-on: [self-hosted, forpro, preprod, docker]
    timeout-minutes: 15
    environment: preprod
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to preproduction
        uses: ./.github/actions/deploy
        with:
          deploy_path:          ${{ secrets.DEPLOY_PATH }}
          ghcr_user:            ${{ secrets.GHCR_PULL_USER || github.actor }}
          ghcr_token:           ${{ secrets.GHCR_PULL_TOKEN }}
          image_tag:            ${{ needs.meta.outputs.image_tag }}
          floating_tag:         ${{ needs.meta.outputs.floating_tag }}
          release_id:           ${{ needs.meta.outputs.release_id }}
          built_services:       ${{ needs.changes.outputs.services_csv }}
          compose_project_name: ${{ secrets.COMPOSE_PROJECT_NAME || 'forpro-preprod' }}
          cms_http_port:        ${{ vars.CMS_HTTP_PORT }}
          website_http_port:    ${{ vars.WEBSITE_HTTP_PORT }}
          restaurant_http_port: ${{ vars.RESTAURANT_HTTP_PORT }}
          menu_http_port:       ${{ vars.MENU_HTTP_PORT }}

  # ---------------------------------------------------------------------------
  # Production deploy.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    needs: [meta, changes, build]
    if: needs.meta.outputs.target == 'production'
    runs-on: [self-hosted, forpro, production, docker]
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to production
        uses: ./.github/actions/deploy
        with:
          deploy_path:          ${{ secrets.DEPLOY_PATH }}
          ghcr_user:            ${{ secrets.GHCR_PULL_USER || github.actor }}
          ghcr_token:           ${{ secrets.GHCR_PULL_TOKEN }}
          image_tag:            ${{ needs.meta.outputs.image_tag }}
          floating_tag:         ${{ needs.meta.outputs.floating_tag }}
          release_id:           ${{ needs.meta.outputs.release_id }}
          built_services:       ${{ needs.changes.outputs.services_csv }}
          compose_project_name: ${{ secrets.COMPOSE_PROJECT_NAME || 'forpro' }}
          cms_http_port:        ${{ vars.CMS_HTTP_PORT }}
          website_http_port:    ${{ vars.WEBSITE_HTTP_PORT }}
          restaurant_http_port: ${{ vars.RESTAURANT_HTTP_PORT }}
          menu_http_port:       ${{ vars.MENU_HTTP_PORT }}
