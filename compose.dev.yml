services:

  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8888:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # SvelteKit
  restaurant:
    build:
      context: ./restaurant
      dockerfile: Dockerfile.dev
    user: "1000:1000"
    volumes:
      - ./restaurant:/app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PUBLIC_CMS_BASE_URL=http://cms.localhost
      - PUBLIC_MENU_BASE_URL=http://menu.localhost
      # 'preprod' disables indexing (noindex + robots.txt disallow) and analytics.
      - PUBLIC_ENVIRONMENT=development
    # Make `cms.localhost` resolvable from inside the container so SSR fetches
    # hit Traefik on the Docker host (same URL the browser uses).
    extra_hosts:
      - "cms.localhost:host-gateway"
    restart: unless-stopped
    depends_on:
      - cms
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restaurant.rule=Host(`restaurant.localhost`)"
      - "traefik.http.routers.restaurant.entrypoints=web"
      - "traefik.http.services.restaurant.loadbalancer.server.port=5173"

  # SvelteKit
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    user: "1000:1000"
    volumes:
      - ./website:/app
    ports:
      - "5174:5173"
    environment:
      - NODE_ENV=development
      - PUBLIC_CMS_BASE_URL=http://cms.localhost
      # 'preprod' disables indexing (noindex + robots.txt disallow) and analytics.
      - PUBLIC_ENVIRONMENT=development
    # Make `cms.localhost` resolvable from inside the container so SSR fetches
    # hit Traefik on the Docker host (same URL the browser uses).
    extra_hosts:
      - "cms.localhost:host-gateway"
    restart: unless-stopped
    depends_on:
      - cms
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`website.localhost`)"
      - "traefik.http.routers.website.entrypoints=web"
      - "traefik.http.services.website.loadbalancer.server.port=5173"

  # Nuxt
  menu:
    build:
      context: ./menu
      dockerfile: Dockerfile.dev
    user: "1000:1000"
    volumes:
      - ./menu:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_CMS_BASE_URL=http://cms.localhost
      # 'preprod' disables indexing (noindex + robots.txt disallow).
      - NUXT_PUBLIC_ENVIRONMENT=development
    extra_hosts:
      - "cms.localhost:host-gateway"
    restart: unless-stopped
    depends_on:
      - cms
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.menu.rule=Host(`menu.localhost`)"
      - "traefik.http.routers.menu.entrypoints=web"
      - "traefik.http.services.menu.loadbalancer.server.port=3000"

  # Kirby CMS
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile.dev
      args:
        UID: 1000
        GID: 1000
    volumes:
      - ./cms/composer.json:/var/www/html/composer.json:rw
      - ./cms/composer.lock:/var/www/html/composer.lock:rw
      - ./cms/content:/var/www/html/content:rw
      - ./cms/site/config:/var/www/html/site/config:rw
      - ./cms/site/plugins:/var/www/html/site/plugins:rw
      - ./cms/site/accounts:/var/www/html/site/accounts:rw
      - ./cms/site/blueprints:/var/www/html/site/blueprints:rw
      - ./cms/site/templates:/var/www/html/site/templates:rw
      - ./cms/utils:/var/www/html/utils:rw
      - ./cms/index.php:/var/www/html/index.php:rw
      - ./cms/media:/var/www/html/media:rw
      - ./cms/_custom-panel:/var/www/html/_custom-panel:rw
      - kirby_cache:/var/www/html/site/cache:rw
      - kirby_sessions:/var/www/html/site/sessions:rw
    env_file:
      - ./cms/.env
    environment:
      - KIRBY_FRONTEND_URL=http://website.localhost
      - KIRBY_VUE_COMPILER=true
      - KIRBY_DEBUG=true
      - KIRBY_SMTP_HOST=mailpit
      - KIRBY_SMTP_PORT=1025
      - KIRBY_SMTP_SECURITY=false
      - KIRBY_SMTP_AUTH=false
      - KIRBY_SMTP_USERNAME=
      - KIRBY_SMTP_PASSWORD=
    ports:
      - "8000:80"
    restart: unless-stopped
    depends_on:
      - mailpit
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cms.rule=Host(`cms.localhost`)"
      - "traefik.http.routers.cms.entrypoints=web"
      - "traefik.http.services.cms.loadbalancer.server.port=80"

  # Mailpit — catches all outgoing mail in dev (SMTP on 1025, web UI on 8025)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

volumes:
  kirby_cache:
  kirby_sessions:
  restaurant_node_modules:
  website_node_modules:
  menu_node_modules:
