version: '3.8'

services:

  db:
    image: postgres:12.17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: 'forpro_calendar'
      POSTGRES_USER: 'forpro'
      POSTGRES_PASSWORD: '***REMOVED***'
    ports:
      - "5432:5432"

  calendar:
    build: ./easyappointments
    volumes:
      - ./easyappointments/assets/99-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
      - ./easyappointments/assets/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - calendar_data:/var/www/html
    ports:
      - "8003:80"
    restart: always
    depends_on:
      - mysql

  mysql:
    image: 'mysql:8.0'
    volumes:
      - './docker/mysql:/var/lib/mysql'
    environment:
      - MYSQL_ROOT_PASSWORD=***REMOVED***
      - MYSQL_DATABASE=easyappointment

  frontend:
    build: ./website
    ports:
      - "3000:3000"
    restart: always

  cms:
    image: ./cms
    volumes:
      - kirby_data:/var/www/html
    depends_on:
      - db
    ports:
      - "8002:80"
    restart: always

volumes:
  postgres_data:
  kirby_data:
  calendar_data:
