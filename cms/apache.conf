ServerTokens Prod
ServerSignature Off

# TRACE is not needed and enables Cross-Site Tracing.
TraceEnable Off

# Sans PassEnv, Browsershot ne trouve pas le binaire Chromium depuis PHP.
PassEnv PUPPETEER_EXECUTABLE_PATH
PassEnv PUPPETEER_SKIP_DOWNLOAD

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Les URL /media intègrent <fileHash>-<modified>, donc cachables un an ; ne jamais étendre hors de /media/.
# `always` pour que l'en-tête soit aussi porté par les 304.
# CORS : /media est servi sans PHP, le header de config.php ne s'applique pas ; le website les charge en fetch() (Lottie).
<IfModule mod_headers.c>
    <LocationMatch "^/media/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set Access-Control-Allow-Origin "*"
    </LocationMatch>
</IfModule>
