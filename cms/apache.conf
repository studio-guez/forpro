# Custom Apache config, enabled as conf-available/custom.conf.
# The actual rewrite + access rules live in Kirby's .htaccess,
# which AllowOverride All lets take effect.

# Do not advertise the server version.
ServerTokens Prod
ServerSignature Off

# TRACE is not needed and enables Cross-Site Tracing.
TraceEnable Off

# Sans PassEnv, ces variables ne sont pas visibles depuis PHP/mod_php
# et Browsershot ne trouve pas le binaire Chromium.
PassEnv PUPPETEER_EXECUTABLE_PATH
PassEnv PUPPETEER_SKIP_DOWNLOAD

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Les URL /media de Kirby intègrent <fileHash>-<modified> : le rendu servi à une
# URL donnée ne change jamais (une source modifiée produit une nouvelle URL), il
# est donc cachable un an. Strictement limité à /media/ — le Panel, global.json
# et les payloads de pages doivent continuer à revalider à chaque requête.
# `always` et non `onsuccess` pour que l'en-tête soit aussi porté par les 304.
<IfModule mod_headers.c>
    <LocationMatch "^/media/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
