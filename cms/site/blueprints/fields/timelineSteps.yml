# Steps of a timeline, shared by the `module-timeline` block and the
# `job-offer` recruiting steps so both render through the same module.
label:
  en: Steps
  fr: Étapes
type: structure
min: 1
fields:
  title:
    label:
      en: Title
      fr: Titre
    type: text
    required: true
    maxlength: 40
  shortDesc:
    label:
      en: Short description
      fr: Description courte
    # Plain text, no formatting at all: the text sits in a fixed-size shape.
    type: textarea
    buttons: false
    size: small
    maxlength: 70
