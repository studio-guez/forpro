# Three title/description pairs, shared by the `module-infos-pratiques` and
# `module-3-elements` blocks so both render through the same UI component.
label:
  en: Elements
  fr: Éléments
type: structure
max: 1
columns:
  title1:
    width: 1/3
  title2:
    width: 1/3
  title3:
    width: 1/3
fields:
  title1:
    label:
      en: Title element 1
      fr: Titre élément 1
    type: text
    required: true
  description1:
    label:
      en: Description element 1
      fr: Description élément 1
    extends: fields/writer
    required: true
  description1separator:
    type: line
  title2:
    label:
      en: Title element 2
      fr: Titre élément 2
    type: text
    required: true
  description2:
    label:
      en: Description element 2
      fr: Description élément 2
    extends: fields/writer
    required: true
  description2separator:
    type: line
  title3:
    label:
      en: Title element 3
      fr: Titre élément 3
    type: text
    required: true
  description3:
    label:
      en: Description element 3
      fr: Description élément 3
    extends: fields/writer
    required: true
