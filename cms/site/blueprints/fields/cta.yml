label:
  en: CTA
  fr: CTA
type: structure
max: 1
columns:
  label:
    width: 1/6
  page:
    width: 1/6
  url:
    width: 1/6
  email:
    width: 1/6
  phone:
    width: 1/6
  icon:
    width: 1/6
fields:
  label:
    label: { en: Label, fr: Libellé }
    type: text
  type:
    label: { en: Type, fr: Type }
    type: select
    default: page
    required: true
    options:
      - value: page
        text: { en: Page, fr: Page }
      - value: url
        text: { en: External URL, fr: URL externe }
      - value: mailto
        text: { en: Email, fr: Email }
      - value: tel
        text: { en: Phone, fr: Téléphone }
  page:
    extends: fields/pageLink
  url:
    label: { en: URL, fr: URL }
    type: url
    when:
      type: url
  email:
    label: { en: Email, fr: Email }
    type: email
    when:
      type: mailto
  phone:
    label: { en: Phone, fr: Téléphone }
    type: tel
    when:
      type: tel
  icon:
    label: { en: Icon, fr: Icône }
    type: select
    placeholder: { en: None, fr: Aucun }
    default: arrow
    options:
      - value: arrow
        text: { en: "→", fr: "→" }
      - value: plus
        text: { en: "+", fr: "+" }
      - value: email
        text: { en: Email, fr: Email }
      - value: phone
        text: { en: Phone, fr: Téléphone }
