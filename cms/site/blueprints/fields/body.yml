# Reusable module blockbuilder. Shared by the `page`, `team` and `job-offers`
# templates so they all expose the same `body` payload to the frontend.
# Keyed (not a plain list) so an extending blueprint can drop a single module
# with `<module>: false` instead of restating the whole set.
label:
  en: Content
  fr: Contenu
type: blocks
fieldsets:
  module-titre-texte-image: true
  module-cases: true
  module-grille-images: true
  module-video: true
  module-infos-pratiques: true
  module-3-elements: true
  module-timeline: true
  module-agenda: true
  module-projets: true
  module-cta: true
  module-partenaires: true
