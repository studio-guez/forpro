tabs:
  content:
    label:
      en: Content
      fr: Contenu

    icon: text

    columns:
      - width: 1/3

        fields:
          files:
            label:
              en: Files
              fr: Fichiers
            type: files
            layout: small

      - width: 2/3

        sections:
          events:
            label: "Événements"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.find("events")
            templates:
              - event
            create: event

          projects:
            label: "Projets"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.find("projects")
            templates:
              - project
            create: project

          faq:
            label: "FAQ"
            type: pages
            image: false
            sortable: false
            max: 1
            parent: site.find("pages")
            templates:
              - faq

          pages:
            label: "Pages"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            text: "{{ page.breadcrumbTitle }}"
            sortBy: breadcrumbtitle asc
            sortable: false
            parent: site.find("pages")
            templates:
              - page
            create: page
  taxonomies:
    label:
      en: Taxonomies
      fr: Taxonomies
    icon: tag
    columns:
      - width: 1/2
        sections:
          event_types:
            type: pages
            image: false
            label:
              en: Event types
              fr: Types d'événement
            templates:
              - event-type
            parent: site.find("taxonomies").find("event-types")
      - width: 1/2
        sections:
          domains:
            type: pages
            image: false
            label:
              en: Domains
              fr: Domaines
            templates:
              - domain
            parent: site.find("taxonomies").find("domains")
      - width: 1/2
        sections:
          project_themes:
            type: pages
            image: false
            label:
              en: Project themes
              fr: Thématiques de projet
            templates:
              - project-theme
            parent: site.find("taxonomies").find("project-themes")
      - width: 1/2
        sections:
          faq_categories:
            type: pages
            image: false
            label:
              en: FAQ Categories
              fr: Catégories de FAQ
            templates:
              - faq-category
            parent: site.find("taxonomies").find("faq-categories")

  navigation: tabs/navigation

  social: tabs/social

  general: tabs/general

  seo: tabs/seo-site

  restaurant: tabs/restaurant
