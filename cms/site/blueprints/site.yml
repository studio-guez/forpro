tabs:
  content:
    label:
      en: Content
      fr: Contenu

    icon: text

    columns:
      - width: 1/3

        fields:
          files:
            label:
              en: Files
              fr: Fichiers
            type: files
            layout: small

      - width: 2/3

        sections:
          events:
            label: "Événements"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.index.template("events").first()
            templates:
              - event
            create: event

          projects:
            label: "Projets"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.index.template("projects").first()
            templates:
              - project
            create: project

          faq:
            label: "FAQ"
            type: pages
            image: false
            sortable: false
            max: 1
            parent: site.index.template("pages").first()
            templates:
              - faq

          pages:
            label: "Pages"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            text: "{{ page.breadcrumbTitle }}"
            sortBy: breadcrumbtitle asc
            sortable: false
            parent: site.index.template("pages").first()
            create: page
  taxonomies:
    label:
      en: Taxonomies
      fr: Taxonomies
    icon: tag
    columns:
      - width: 1/2
        sections:
          eventThemes:
            type: pages
            image: false
            label:
              en: Event themes
              fr: Thématiques d'événement
            templates:
              - event-theme
            parent: site.index.template("event-themes").first()
      - width: 1/2
        sections:
          domains:
            type: pages
            image: false
            label:
              en: Domains
              fr: Domaines
            templates:
              - domain
            parent: site.index.template("domains").first()
      - width: 1/2
        sections:
          projectThemes:
            type: pages
            image: false
            label:
              en: Project themes
              fr: Thématiques de projet
            templates:
              - project-theme
            parent: site.index.template("project-themes").first()
      - width: 1/2
        sections:
          projectTypes:
            type: pages
            image: false
            label:
              en: Project types
              fr: Types de projet
            templates:
              - project-type
            parent: site.index.template("project-types").first()
      - width: 1/2
        sections:
          faqCategories:
            type: pages
            image: false
            label:
              en: FAQ Categories
              fr: Catégories de FAQ
            templates:
              - faq-category
            parent: site.index.template("faq-categories").first()

  navigation: tabs/navigation

  social: tabs/social

  general: tabs/general

  seo: tabs/seo-site
