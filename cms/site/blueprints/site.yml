tabs:
  content:
    label:
      en: Content
      fr: Contenu

    icon: text

    columns:
      - width: 1/3

        fields:
          files:
            label:
              en: Files
              fr: Fichiers
            type: files
            layout: small

      - width: 2/3

        sections:
          events:
            label: "Événements"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.find("events")
            templates:
              - event
            create: event

          projects:
            label: "Projets"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.find("projects")
            templates:
              - project
            create: project

          pages:
            label: "Pages"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            text: "{{ page.breadcrumbTitle }}"
            sortBy: breadcrumbtitle asc
            sortable: false
            parent: site.find("pages")
            templates:
              - page
            create: page
  taxonomies:
    label:
      en: Taxonomies
      fr: Taxonomies
    icon: tag
    columns:
      - width: 1/2
        sections:
          event_types:
            type: pages
            image: false
            label:
              en: Event types
              fr: Types d'événement
            templates:
              - event-type
            parent: site.find("taxonomies").find("event-types")
      - width: 1/2
        sections:
          domaines:
            type: pages
            image: false
            label:
              en: Domains
              fr: Domaines
            templates:
              - domaine
            parent: site.find("taxonomies").find("domaines")
      - width: 1/2
        sections:
          thematiques_de_projet:
            type: pages
            image: false
            label:
              en: Project themes
              fr: Thématiques de projet
            templates:
              - thematique-de-projet
            parent: site.find("taxonomies").find("thematiques-de-projet")

  navigation: tabs/navigation

  social: tabs/social

  general: tabs/general

  restaurant: tabs/restaurant

  seo: seo/site
