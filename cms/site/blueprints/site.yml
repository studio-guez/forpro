tabs:
  content:
    label:
      en: Content
      fr: Contenu

    icon: text

    columns:
      - width: 1/3

        sections:

          home:
            label: "Page d'accueil"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            sortable: false
            max: 1
            parent: site.index.template("pages").first()
            query: page.childrenAndDrafts.filterBy("slug", "home")
            create: false

          faq:
            label: "FAQ"
            type: pages
            image: false
            sortable: false
            max: 1
            parent: site.index.template("pages").first()
            templates:
              - faq

          pages:
            label: "Pages"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            text: "{{ page.breadcrumbTitle }}"
            sortBy: breadcrumbtitle asc
            sortable: false
            parent: site.index.template("pages").first()
            query: page.childrenAndDrafts.filterBy("slug", "!=", "home")
            templatesIgnore:
              - faq
            create: page
            
      - width: 1/3

        sections:
          events:
            label: "Événements"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.index.template("events").first()
            limit: 10
            sortBy: dateStart desc
            templates:
              - event
            create: event

          projects:
            label: "Projets"
            type: pages
            image:
              query: page.cover.toFile
              cover: true
            parent: site.index.template("projects").first()
            limit: 10
            templates:
              - project
            create: project

      - width: 1/3
        sections:
          jobOffers:
            label: "Offres d'emploi"
            type: pages
            image: false
            parent: site.index.template("job-offers").first()
            limit: 10
            templates:
              - job-offer
            create: job-offer

          missions:
            label: "Missions"
            type: pages
            image: false
            parent: site.index.template("missions").first()
            limit: 10
            templates:
              - mission
            create: mission

  taxonomies:
    label:
      en: Taxonomies
      fr: Taxonomies
    icon: tag
    columns:
      - width: 1/2
        sections:
          eventThemes:
            type: pages
            image: false
            label:
              en: Event themes
              fr: Thématiques d'événement
            templates:
              - event-theme
            parent: site.index.template("event-themes").first()
      - width: 1/2
        sections:
          domains:
            type: pages
            image: false
            label:
              en: Domains
              fr: Domaines
            templates:
              - domain
            parent: site.index.template("domains").first()
      - width: 1/2
        sections:
          projectThemes:
            type: pages
            image: false
            label:
              en: Project themes
              fr: Thématiques de projet
            templates:
              - project-theme
            parent: site.index.template("project-themes").first()
      - width: 1/2
        sections:
          projectTypes:
            type: pages
            image: false
            label:
              en: Project types
              fr: Types de projet
            templates:
              - project-type
            parent: site.index.template("project-types").first()
      - width: 1/2
        sections:
          faqCategories:
            type: pages
            image: false
            label:
              en: FAQ Categories
              fr: Catégories de FAQ
            templates:
              - faq-category
            parent: site.index.template("faq-categories").first()
      - width: 1/2
        sections:
          jobOfferCategories:
            type: pages
            image: false
            label:
              en: Job offer categories
              fr: Catégories d'offre d'emploi
            templates:
              - job-offer-category
            parent: site.index.template("job-offer-categories").first()

  navigation: tabs/navigation

  social: tabs/social

  general: tabs/general

  seo: tabs/seo-site

  restaurant: tabs/restaurant
