tabs:
  content:
    label:
      en: Content
      fr: Contenu

    icon: text

    columns:
      - width: 1/3

        fields:
          files:
            label:
              en: Files
              fr: Fichiers
            type: files
            layout: small

      - width: 2/3

        sections:
          events:
            label: "Événements"
            type: pages
            image:
              cover: true
            templates:
              - events

          projects:
            label: "Projets"
            type: pages
            image:
              cover: true
            templates:
              - projects

          pages:
            label: "Pages"
            type: pages
            image:
              cover: true
            templates:
              - pages
  taxonomies:
    label:
      en: Taxonomies
      fr: Taxonomies
    icon: tag
    columns:
      - width: 1/2
        sections:
          event_types:
            type: pages
            image: false
            label:
              en: Event types
              fr: Types d'événement
            templates:
              - event-type
            parent: site.find("taxonomies").find("event-types")
      - width: 1/2
        sections:
          domaines:
            type: pages
            image: false
            label:
              en: Domains
              fr: Domaines
            templates:
              - domaine
            parent: site.find("taxonomies").find("domaines")

  restaurant: tabs/restaurant

  seo: seo/site
