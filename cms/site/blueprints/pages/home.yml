title:
  en: Home page
  fr: Page d'accueil

extends: pages/core-page

icon: home

tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    fields:
      title:
        label:
          en: Title
          fr: Titre
        type: text
        required: true

      animationLabel:
        label:
          en: Animation
          fr: Animation
        type: headline
      lottie:
        label:
          en: Lottie animation
          fr: Animation Lottie
        type: files
        uploads: lottie
        max: 1
        layout: list
        required: true
        width: 1/2
        help:
          en: A `.json` or `.lottie` export, played in a loop above the welcome text.
          fr: Un export `.json` ou `.lottie`, joué en boucle au-dessus du texte de bienvenue.
      lottieMobile:
        label:
          en: Lottie animation (mobile)
          fr: Animation Lottie (mobile)
        type: files
        uploads: lottie
        max: 1
        layout: list
        width: 1/2
        help:
          en: Variant shown on small screens. Leave empty to reuse the desktop animation.
          fr: Variante affichée sur petits écrans. Laisser vide pour réutiliser l'animation desktop.

      welcomeLabel:
        label:
          en: Welcome
          fr: Bienvenue
        type: headline
      welcomeTitle:
        label:
          en: Title
          fr: Titre
        type: text
        required: true
        width: 1/3
      welcomeShortDesc:
        extends: fields/writer
        label:
          en: Short description
          fr: Description courte
        required: true
        width: 2/3

      welcomeCardsLabel:
        label:
          en: Welcome cards
          fr: Cartes de bienvenue
        type: headline
      welcomeCardTitle1:
        label:
          en: Card 1 title
          fr: Titre de la carte 1
        type: text
        required: true
        width: 1/2
      welcomeCardCta1:
        extends: fields/cta
        label:
          en: Card 1 CTA
          fr: CTA de la carte 1
        required: true
        width: 1/2
      welcomeCardTitle2:
        label:
          en: Card 2 title
          fr: Titre de la carte 2
        type: text
        required: true
        width: 1/2
      welcomeCardCta2:
        extends: fields/cta
        label:
          en: Card 2 CTA
          fr: CTA de la carte 2
        required: true
        width: 1/2
      welcomeCardTitle3:
        label:
          en: Card 3 title
          fr: Titre de la carte 3
        type: text
        required: true
        width: 1/2
      welcomeCardCta3:
        extends: fields/cta
        label:
          en: Card 3 CTA
          fr: CTA de la carte 3
        required: true
        width: 1/2

      resourcesLabel:
        label:
          en: Resources
          fr: Ressources
        type: headline
      resourcesTitle:
        label:
          en: Section title
          fr: Titre de la section
        type: text
        required: true
        width: 1/2
      projectsOvertitle:
        label:
          en: Overtitle of the project cards
          fr: Sur-titre des cartes projet
        type: text
        required: true
        default: Projet
        width: 1/2
        help:
          en: The carousel shows 3 random pages from the list below and 2 random projects; this label sits above every project title.
          fr: Le carrousel affiche 3 pages au hasard parmi la liste ci-dessous et 2 projets au hasard ; ce libellé s'affiche au-dessus de chaque titre de projet.
      resourcesAvailablePages:
        label:
          en: Available pages
          fr: Pages disponibles
        type: structure
        min: 3
        columns:
          cover:
            width: 1/6
          page:
            width: 1/3
          overtitle:
            width: 1/4
          title:
            width: 1/4
        fields:
          page:
            extends: fields/pageSelect
            required: true
          overtitle:
            label:
              en: Overtitle
              fr: Sur-titre
            type: text
          title:
            label:
              en: Title
              fr: Titre
            type: text
            help:
              en: The page title when left empty.
              fr: Le titre de la page si vide.
          shortDesc:
            extends: fields/writer
            label:
              en: Short description
              fr: Description courte
            help:
              en: The page's own short description / intro when left empty.
              fr: La description courte / introduction de la page si vide.
          cover:
            extends: fields/cover
            required: false
            help:
              en: The page cover when left empty.
              fr: L'image de couverture de la page si vide.

  seo: tabs/seo
