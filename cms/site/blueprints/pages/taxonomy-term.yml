status:
  draft: true
  listed: true

# Sections rather than root-level `fields` so a term blueprint can add its own
# sections (Kirby drops `sections` as soon as `fields` is set at the root).
sections:
  content:
    type: fields
    fields:
      title:
        label:
          en: Name
          fr: Nom
        type: text
      color:
        extends: fields/color