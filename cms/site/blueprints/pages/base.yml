tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    columns:
      sidebar:
        width: 1/4
        sticky: true
        sections:
          hierarchy:
            type: fields
          title:
            type: fields
            fields:
              title:
                label:
                  en: Title
                  fr: Titre
                type: text
                required: true
          cover:
            type: fields
            fields:
              sepCover:
                type: line
              cover:
                label:
                  en: Cover image
                  fr: Image de couverture
                type: files
                max: 1
                layout: cards
                required: true
                uploads:
                  template: image
      main:
        width: 3/4
        sections:
          intro:
            type: fields
            fields:
              introLabel:
                label:
                  en: Intro
                  fr: Introduction
                type: headline
              introTitle:
                label:
                  en: Intro title
                  fr: Titre introduction
                type: text
                required: true
                width: 2/3
              introTitleImage:
                label:
                  en: Image to display instead of the title
                  fr: Image à afficher à la place du titre
                type: files
                max: 1
                layout: list
                uploads:
                  template: image
                width: 1/3
              intro:
                extends: fields/writer
                label:
                  en: Intro
                  fr: Introduction
                required: true
          main:
            type: fields
            fields:
              contentLabel:
                label:
                  en: Content
                  fr: Contenu
                type: headline
  seo: tabs/seo
