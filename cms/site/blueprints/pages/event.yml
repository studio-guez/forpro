title:
  en: Event
  fr: Événement

extends: pages/event-project-base

status:
  draft: true
  listed: true

num: zero

options:
  preview: "{{ page.frontendUrl }}"

tabs:
  content:
    columns:
      sidebar:
        sections:
          dates:
            type: fields
            fields:
              sepDates:
                type: line
              dateStart:
                label:
                  en: Start date
                  fr: Date de début
                type: date
                required: true
                width: 1/2
              dateEnd:
                label:
                  en: End date
                  fr: Date de fin
                type: date
                width: 1/2
              timeStart:
                label:
                  en: Start time
                  fr: Heure de début
                type: text
                placeholder: HH:mm
                width: 1/2
              timeEnd:
                label:
                  en: End time
                  fr: Heure de fin
                type: text
                placeholder: HH:mm
                width: 1/2
          taxonomies:
            type: fields
            fields:
              sepTaxonomies:
                type: line
              domains:
                extends: fields/taxonomies/domains
              eventThemes:
                extends: fields/taxonomies/event-themes
