# Shared base for event and project pages.
# Provides the fields common to both content types:
#   - title / subtitle / shortDesc / cover (sidebar)
#   - medias + videos (upload or YouTube), repeatable content blocks and external links (main)
# Event- and project-specific fields (dates, taxonomies, collective, ...) are
# added by pages/event.yml and pages/project.yml, which extend this blueprint.
tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    columns:
      sidebar:
        width: 1/3
        sticky: true
        sections:
          meta:
            type: fields
            fields:
              title:
                label:
                  en: Title
                  fr: Titre
                type: text
                required: true
              subtitle:
                label:
                  en: Subtitle
                  fr: Sous-titre
                type: text
                required: true
              shortDesc:
                label:
                  en: Short description
                  fr: Description courte
                extends: fields/writer
                required: true
              sepCover:
                type: line
              cover:
                extends: fields/cover
      main:
        width: 2/3
        sections:
          media:
            type: fields
            fields:
              mediaLabel:
                label:
                  en: Media
                  fr: Médias
                type: headline
              medias:
                label:
                  en: Medias (images or videos)
                  fr: Médias (images ou vidéos)
                type: files
                layout: cards
                uploads: media
              videos:
                extends: fields/video
                help:
                  en: Displayed below the media gallery. Each video is either an uploaded file or a YouTube link.
                  fr: Affichées sous la galerie de médias. Chaque vidéo est soit un fichier téléversé, soit un lien YouTube.
          blocks:
            type: fields
            fields:
              contentLabel:
                label:
                  en: Content
                  fr: Contenu
                type: headline
              blocks:
                extends: fields/contentBlocks
          links:
            type: fields
            fields:
              externalLinks:
                label:
                  en: External links
                  fr: Liens externes
                type: structure
                fields:
                  title:
                    label:
                      en: Title
                      fr: Titre
                    type: text
                    required: true
                  link:
                    label:
                      en: Link
                      fr: Lien
                    type: url
                    required: true
  seo: tabs/seo
