tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    columns:
      sidebar:
        width: 1/3
        sticky: true
        sections:
          meta:
            type: fields
            fields:
              title:
                label:
                  en: Title
                  fr: Titre
                type: text
                required: true
              subtitle:
                label:
                  en: Subtitle
                  fr: Sous-titre
                type: text
                required: true
              shortDesc:
                label:
                  en: Short description
                  fr: Description courte
                extends: fields/writer
                required: true
              sepCover:
                type: line
              cover:
                extends: fields/cover
      main:
        width: 2/3
        sections:
          body:
            type: fields
            fields:
              body:
                extends: fields/contentBody
  seo: tabs/seo
