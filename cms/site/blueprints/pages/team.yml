title:
  en: Team
  fr: Équipe

extends: pages/core-page

icon: users

tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    fields:
      title:
        label:
          en: Title
          fr: Titre
        type: text
        required: true
      shortDesc:
        label:
          en: Short description
          fr: Description courte
        extends: fields/writer
      sections:
        label:
          en: Sections
          fr: Sections
        type: structure
        columns:
          title:
            width: 1/2
          members:
            width: 1/2
        fields:
          title:
            label:
              en: Section title
              fr: Titre de la section
            type: text
            required: true
          members:
            label:
              en: Members
              fr: Membres
            type: structure
            columns:
              name:
                width: 1/4
              role:
                width: 1/4
              status:
                width: 1/4
              linkedin:
                width: 1/4
            fields:
              name:
                label:
                  en: Name
                  fr: Nom
                type: text
                required: true
              role:
                label:
                  en: Role
                  fr: Fonction
                type: text
              status:
                label:
                  en: Status
                  fr: Statut
                type: select
                options:
                  - value: apprenti
                    text: { en: Apprentice, fr: Apprenti·e }
                  - value: employe
                    text: { en: Employee, fr: Employé·e }
              linkedin:
                label:
                  en: LinkedIn link
                  fr: Lien LinkedIn
                type: url
      ctaModule:
        label:
          en: CTA module
          fr: Module CTA
        type: blocks
        max: 1
        fieldsets:
          - module-cta

  seo: tabs/seo
