title:
  en: Projects
  fr: Projets

extends: pages/core-page

icon: layout

tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    sections:
      meta:
        type: fields
        fields:
          title:
            label:
              en: Title
              fr: Titre
            type: text
            required: true
      projects:
        extends: sections/child-pages
        label:
          en: Projects
          fr: Projets
        templates:
          - project
        create: project
      extra:
        type: fields
        fields:
          body:
            extends: fields/bodyExtra
            # The projects module would just duplicate the listing above.
            fieldsets:
              module-projects: false

  seo: tabs/seo
