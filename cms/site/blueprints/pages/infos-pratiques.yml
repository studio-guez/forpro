title:
  en: Practical information
  fr: Infos pratiques

extends: pages/core-page

icon: pin

tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    fields:
      title:
        label:
          en: Title
          fr: Titre
        type: text
        required: true

      openingHoursLabel:
        label:
          en: Opening hours
          fr: Horaires d'ouverture
        type: headline
      openingHoursTitle:
        label:
          en: Section title
          fr: Titre de la section
        type: text
      openingHoursContent:
        extends: fields/writer
        label:
          en: Opening hours
          fr: Horaires

      foodlabLabel:
        label:
          en: FoodLab card
          fr: Carte FoodLab
        type: headline
      foodlabOpeningHoursTitle:
        label:
          en: Card title
          fr: Titre de la carte
        type: text
        width: 1/2
      foodlabImage:
        extends: fields/cover
        label:
          en: Card image
          fr: Image de la carte
        required: false
        width: 1/2
      foodlabCta:
        extends: fields/cta

      accessLabel:
        label:
          en: Access
          fr: Accès
        type: headline
      accessTitle:
        label:
          en: Section title
          fr: Titre de la section
        type: text
      accessContent:
        extends: fields/writer
        label:
          en: Access details
          fr: Informations d'accès
      mapEmbedUrl:
        label:
          en: Google Maps embed URL
          fr: URL d'intégration Google Maps
        type: url
        help:
          en: 'On Google Maps, open the place, click "Share" → "Embed a map" and paste the src of the given iframe (it starts with https://www.google.com/maps/embed). Any other URL is ignored.'
          fr: "Sur Google Maps, ouvrir le lieu, cliquer sur « Partager » → « Intégrer une carte » et coller le src de l'iframe proposée (il commence par https://www.google.com/maps/embed). Toute autre URL est ignorée."

  seo: tabs/seo
