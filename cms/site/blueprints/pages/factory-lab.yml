title:
  en: FactoryLab
  fr: FactoryLab

extends: pages/core-page

icon: briefcase

tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    columns:
      sidebar:
        width: 1/4
        sticky: true
        sections:
          hierarchy:
            type: fields
            fields:
              parentPage:
                label:
                  en: Parent page
                  fr: Page parente
                type: pages
                query: page.possibleParents
                text: "{{ page.breadcrumbTitle }}"
                multiple: false
                max: 1
                link: false
                empty:
                  en: No parent page
                  fr: Aucune page parente
              sepHierarchy:
                type: line
          title:
            type: fields
            fields:
              headerType:
                extends: fields/headerType
              title:
                label:
                  en: Title
                  fr: Titre
                type: text
                required: true
              overtitle:
                label:
                  en: Overtitle
                  fr: Sur-titre
                type: text
                when:
                  headerType: full
              theme:
                extends: fields/theme
          cover:
            type: fields
            fields:
              sepCover:
                type: line
              cover:
                extends: fields/cover
      main:
        width: 3/4
        sections:
          intro:
            type: fields
            fields:
              introLabel:
                label:
                  en: Intro
                  fr: Introduction
                type: headline
              introTitle:
                label:
                  en: Intro title
                  fr: Titre introduction
                type: text
                required: true
                width: 2/3
                when:
                  headerType: full
              introTitleImage:
                label:
                  en: Image to display instead of the title
                  fr: Image à afficher à la place du titre
                type: files
                max: 1
                layout: list
                uploads: image
                width: 1/3
                when:
                  headerType: full
              intro:
                extends: fields/writer
                label:
                  en: Intro
                  fr: Introduction
                required: true
              introCta:
                label:
                  en: CTA intro
                  fr: CTA introduction
                extends: fields/cta
                when:
                  headerType: full
              introLayout:
                label:
                  en: Layout intro
                  fr: Mise en page introduction
                type: toggles
                default: 1col
                required: true
                options:
                  - value: 1col
                    text: { en: 1 column, fr: 1 colonne }
                  - value: 2col
                    text: { en: 2 columns, fr: 2 colonnes }
                when:
                  headerType: full
              sepIntro:
                type: line
          companies:
            type: fields
            fields:
              companiesLabel:
                label:
                  en: Training companies
                  fr: Entreprises formatrices
                type: headline
              companiesTitle:
                label:
                  en: Module title
                  fr: Titre du module
                type: text
                required: true
                width: 2/3
              companiesVariant:
                extends: fields/variant
                width: 1/3
              companiesIntro:
                extends: fields/writer
                label:
                  en: Module intro
                  fr: Introduction du module
              companiesTrainingsLabel:
                label:
                  en: Label of the trainings list
                  fr: Libellé de la liste des formations
                type: text
                default: "Formations proposées :"
                width: 1/3
              companiesAvailabilityLabel:
                label:
                  en: Label of the availability list
                  fr: Libellé de la liste des places
                type: text
                default: "Places disponibles :"
                width: 1/3
              companiesFollowUpLabel:
                label:
                  en: Label of the follow-up list
                  fr: Libellé de la liste des suivis
                type: text
                default: "Autres possibilités de suivi :"
                width: 1/3
              companies:
                label:
                  en: Companies
                  fr: Entreprises
                type: structure
                columns:
                  image:
                    width: 1/6
                  title:
                    width: 1/4
                  url:
                    width: 1/4
                  description:
                    width: 1/3
                fields:
                  image:
                    label:
                      en: Image
                      fr: Image
                    type: files
                    required: true
                    max: 1
                    layout: list
                    uploads: image
                  title:
                    label:
                      en: Company name
                      fr: Nom de l'entreprise
                    type: text
                    required: true
                  url:
                    label:
                      en: Website
                      fr: Site web
                    type: url
                  description:
                    extends: fields/writer
                    label:
                      en: Description
                      fr: Description
                  trainings:
                    label:
                      en: Trainings offered
                      fr: Formations proposées
                    type: structure
                    columns:
                      label:
                        width: 1/2
                      url:
                        width: 1/2
                    fields:
                      label:
                        label:
                          en: Label
                          fr: Libellé
                        type: text
                        required: true
                      url:
                        label:
                          en: Link
                          fr: Lien
                        type: url
                  availability:
                    label:
                      en: Available places
                      fr: Places disponibles
                    type: structure
                    columns:
                      label:
                        width: 1/2
                      url:
                        width: 1/2
                    fields:
                      label:
                        label:
                          en: Label
                          fr: Libellé
                        type: text
                        required: true
                      url:
                        label:
                          en: Link
                          fr: Lien
                        type: url
                  followUps:
                    label:
                      en: Other follow-up options
                      fr: Autres possibilités de suivi
                    type: structure
                    fields:
                      label:
                        label:
                          en: Label
                          fr: Libellé
                        type: text
                        required: true
              sepCompanies:
                type: line
          main:
            type: fields
            fields:
              contentLabel:
                label:
                  en: Content
                  fr: Contenu
                type: headline
              body:
                extends: fields/body
  seo: tabs/seo
