title:
  en: Page
  fr: Page

extends: pages/base

status:
  draft: true
  listed: true

options:
  preview: "{{ page.frontendUrl }}"

tabs:
  content:
    columns:
      sidebar:
        sections:
          hierarchy:
            fields:
              parentPage:
                label:
                  en: Parent page
                  fr: Page parente
                type: pages
                query: page.possibleParents
                text: "{{ page.breadcrumbTitle }}"
                multiple: false
                max: 1
                link: false
                empty:
                  en: No parent page
                  fr: Aucune page parente
              sepHierarchy:
                type: line
          title:
            fields:
              overtitle:
                label:
                  en: Overtitle
                  fr: Sur-titre
                type: text
              titleArrow:
                label:
                  en: Arrow
                  fr: Flèche
                type: select
                options:
                  - value: white
                    text: { en: White, fr: Blanc }
                  - value: blue
                    text: { en: Blue, fr: Bleu }
                  - value: orange
                    text: { en: Orange, fr: Orange }
                  - value: pink
                    text: { en: Pink, fr: Rose }
                  - value: purple
                    text: { en: Purple, fr: Violet }
      main:
        fields:
          body:
            type: blocks
            label:
              en: Content
              fr: Contenu
            fieldsets:
              - agenda
