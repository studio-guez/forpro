title:
  en: Page
  fr: Page

status:
  draft: true
  listed: true

num: zero

options:
  preview: "{{ page.frontendUrl }}"

tabs:
  content:
    label:
      en: Content
      fr: Contenu
    icon: text
    columns:
      sidebar:
        width: 1/4
        sticky: true
        sections:
          hierarchy:
            type: fields
            fields:
              parentPage:
                label:
                  en: Parent page
                  fr: Page parente
                type: pages
                query: page.possibleParents
                text: "{{ page.breadcrumbTitle }}"
                multiple: false
                max: 1
                link: false
                empty:
                  en: No parent page
                  fr: Aucune page parente
              sepHierarchy:
                type: line
          title:
            type: fields
            fields:
              title:
                label:
                  en: Title
                  fr: Titre
                type: text
                required: true
              overtitle:
                label:
                  en: Overtitle
                  fr: Sur-titre
                type: text
              theme:
                extends: fields/theme
          cover:
            type: fields
            fields:
              sepCover:
                type: line
              cover:
                extends: fields/cover
      main:
        width: 3/4
        sections:
          intro:
            type: fields
            fields:
              introLabel:
                label:
                  en: Intro
                  fr: Introduction
                type: headline
              introTitle:
                label:
                  en: Intro title
                  fr: Titre introduction
                type: text
                required: true
                width: 2/3
              introTitleImage:
                label:
                  en: Image to display instead of the title
                  fr: Image à afficher à la place du titre
                type: files
                max: 1
                layout: list
                uploads: image
                width: 1/3
              intro:
                extends: fields/writer
                label:
                  en: Intro
                  fr: Introduction
                required: true
              introCta:
                label:
                  en: CTA intro
                  fr: CTA introduction
                extends: fields/cta
              introLayout:
                label:
                  en: Layout intro
                  fr: Mise en page introduction
                type: toggles
                default: 1col
                required: true
                options:
                  - value: 1col
                    text: { en: 1 column, fr: 1 colonne }
                  - value: 2col
                    text: { en: 2 columns, fr: 2 colonnes }
              sepIntro:
                type: line
          main:
            type: fields
            fields:
              contentLabel:
                label:
                  en: Content
                  fr: Contenu
                type: headline
              body:
                extends: fields/body
  seo: tabs/seo
