title:
  en: Page
  fr: Page

extends: pages/base

status:
  draft: true
  listed: true

options:
  preview: "{{ page.frontendUrl }}"

tabs:
  content:
    columns:
      sidebar:
        sections:
          hierarchy:
            fields:
              parentPage:
                label:
                  en: Parent page
                  fr: Page parente
                type: pages
                query: page.possibleParents
                text: "{{ page.breadcrumbTitle }}"
                multiple: false
                max: 1
                link: false
                empty:
                  en: No parent page
                  fr: Aucune page parente
              sepHierarchy:
                type: line
          title:
            fields:
              overtitle:
                label:
                  en: Overtitle
                  fr: Sur-titre
                type: text
              titleArrow:
                label:
                  en: Arrow
                  fr: Flèche
                type: select
                placeholder:
                  en: Without
                  fr: Sans
                options:
                  - value: white
                    text: { en: White, fr: Blanc }
                  - value: blue
                    text: { en: Blue, fr: Bleu }
                  - value: orange
                    text: { en: Orange, fr: Orange }
                  - value: pink
                    text: { en: Pink, fr: Rose }
                  - value: purple
                    text: { en: Purple, fr: Violet }
      main:
        sections:
          intro:
            fields:
              cta:
                label:
                  en: CTA intro
                  fr: CTA introduction
                type: object
                fields:
                  label:
                    label: { en: Label, fr: Libellé }
                    type: text
                  url:
                    label: { en: URL, fr: URL }
                    type: url
              layout:
                label:
                  en: Layout intro
                  fr: Mise en page introduction
                type: toggles
                default: 1col
                options:
                  - value: 1col
                    text: { en: 1 column, fr: 1 colonne }
                  - value: 2col
                    text: { en: 2 columns, fr: 2 colonnes }
              sepIntro:
                type: line
          main:
            fields:
              body:
                type: blocks
                label:
                  en: Content
                  fr: Contenu
                fieldsets:
                  - agenda
