label:
  en: Navigation
  fr: Navigation
icon: menu

columns:
  - width: 1/1
    sections:
      mainMenuSection:
        type: fields
        fields:
          mainMenuHeadline:
            label:
              en: Main menu
              fr: Menu principal
            type: headline
            help:
              en: Links shown in the fixed header
              fr: Liens affichés dans l'en-tête fixe
          mainMenu:
            label:
              en: Main menu
              fr: Menu principal
            type: structure
            columns:
              label:
                width: 1/3
              page:
                width: 1/3
              url:
                width: 1/3
            fields:
              label:
                label:
                  en: Label
                  fr: Libellé
                type: text
              type:
                label: { en: Type, fr: Type }
                type: select
                default: page
                required: true
                options:
                  - value: page
                    text: { en: Page, fr: Page }
                  - value: url
                    text: { en: External URL, fr: URL externe }
              page:
                extends: fields/pageLink
              url:
                label: { en: URL, fr: URL }
                type: url
                when:
                  type: url
          mainMenuLine:
            type: line
          secondaryMenuHeadline:
            label:
              en: Secondary menu
              fr: Menu secondaire
            type: headline
            help:
              en: Links shown in the hamburger menu
              fr: Liens affichés dans le menu hamburger

  - width: 1/2
    sections:
      secondaryColumn1Section:
        type: fields
        fields:
          secondaryColumn1Title:
            label:
              en: "Column 1 — Title"
              fr: "Colonne 1 — Titre"
            type: text
            required: true
          secondaryColumn1Groups:
            label:
              en: "Column 1 — Groups"
              fr: "Colonne 1 — Groupes"
            type: blocks
            fieldsets:
              - navgroup

  - width: 1/2
    sections:
      secondaryColumn2Section:
        type: fields
        fields:
          secondaryColumn2Title:
            label:
              en: "Column 2 — Title"
              fr: "Colonne 2 — Titre"
            type: text
            required: true
          secondaryColumn2Groups:
            label:
              en: "Column 2 — Groups"
              fr: "Colonne 2 — Groupes"
            type: blocks
            fieldsets:
              - navgroup

  - width: 1/2
    sections:
      secondaryColumn3Section:
        type: fields
        fields:
          secondaryColumn3Title:
            label:
              en: "Column 3 — Title"
              fr: "Colonne 3 — Titre"
            type: text
            required: true
          secondaryColumn3Groups:
            label:
              en: "Column 3 — Groups"
              fr: "Colonne 3 — Groupes"
            type: blocks
            fieldsets:
              - navgroup

  - width: 1/2
    sections:
      secondaryColumn4Section:
        type: fields
        fields:
          secondaryColumn4Title:
            label:
              en: "Column 4 — Title"
              fr: "Colonne 4 — Titre"
            type: text
            required: true
          secondaryColumn4Groups:
            label:
              en: "Column 4 — Groups"
              fr: "Colonne 4 — Groupes"
            type: blocks
            fieldsets:
              - navgroup

  - width: 1/1
    sections:
      externalLinksSection:
        type: fields
        fields:
          externalLinksTitle:
            label:
              en: "Other external links — Title"
              fr: "Autres liens externes — Titre"
            type: text
            required: true
          externalLinks:
            label:
              en: Other external links
              fr: Autres liens externes
            type: structure
            help:
              en: Shown in the 5th column of the burger menu.
              fr: Affichés dans la 5e colonne du menu burger.
            columns:
              label:
                width: 1/2
              url:
                width: 1/2
            fields:
              label:
                label:
                  en: Label
                  fr: Libellé
                type: text
                required: true
              url:
                label: { en: URL, fr: URL }
                type: url
                required: true
          externalLinksLine:
            type: line

  - width: 1/1
    sections:
      footerNavSection:
        type: fields
        fields:
          footerNavHeadline:
            label:
              en: Footer navigation
              fr: Navigation du pied de page
            type: headline

  - width: 1/2
    sections:
      footerSocialsSection:
        type: fields
        fields:
          footerSocialsTitle:
            label:
              en: "Socials — Title"
              fr: "Réseaux sociaux — Titre"
            type: text
            help:
              en: The links themselves are managed in the Social networks tab.
              fr: Les liens eux-mêmes sont gérés dans l'onglet Réseaux sociaux.
            required: true

  - width: 1/2
