title:
  en: Cards
  fr: Cartes
icon: copy

preview: fields
wysiwyg: true


fields:

  style:
    label:
      fr: Style
      en: Style
    type: select
    default: style1
    options:
      style1: Style 1
      style2: Style 2

  cards:
    label:
      fr: Liste de cartes
      en: Cards list
    type: structure
    fields:
      color:
        type: color
        label: theme de couleur
        mode: options
        default: "#1754FF"
        options:
          - "#1754FF"
          - "#3DF069"
          - "#B9E6FF"
          - "#BEA5E6"
          - "#FF00FC"
      title:
        label:
          fr: Titre
          en: Title
        type: text
      image:
        label:
          fr: Image
          en: Image
        type: files
        max: 1
        query: model.images
        multiple: false
        image:
          back: black
        uploads:
          template: blocks/image
      link:
        label:
          fr: Lien
          en: Link
        type: url
      text:
        label:
          fr: Texte
          en: Text
        type: writer
        nodes:
          - paragraph
          - bulletList
          - orderedList
