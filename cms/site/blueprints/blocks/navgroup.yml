name:
  en: Link group
  fr: Groupe de liens
icon: list-bullet
preview: fields
fields:
  title:
    label:
      en: Group title (optional)
      fr: Titre du groupe (optionnel)
    type: text
  links:
    label:
      en: Links
      fr: Liens
    type: structure
    columns:
      label:
        width: 1/3
      link:
        width: 1/3
      level:
        width: 1/3
    fields:
      label:
        label:
          en: Label
          fr: Libellé
        type: text
        required: true
      link:
        label:
          en: Link
          fr: Lien
        type: link
        options:
          - page
          - url
        required: true
      level:
        label:
          en: Level
          fr: Niveau
        type: select
        default: "1"
        required: true
        options:
          - value: "1"
            text: { en: Level 1, fr: Niveau 1 }
          - value: "2"
            text: { en: Level 2, fr: Niveau 2 }
