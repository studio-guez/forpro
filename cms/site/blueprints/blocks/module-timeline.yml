extends: blocks/base

name:
  en: Module - Timeline
  fr: Module - Timeline

icon: sort

fields:
  title:
    width: 1/2
    label:
      en: Title
      fr: Titre
    type: text
    required: true
  hideTitle:
    width: 1/2
    label:
      en: Hide title (use as aria-label only)
      fr: Masquer le titre (utilisé comme aria-label uniquement)
    type: toggle
    text:
      - en: Visible
        fr: Visible
      - en: Hidden
        fr: Masqué
    default: false
  steps:
    extends: fields/timelineSteps
