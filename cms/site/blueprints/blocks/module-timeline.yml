    width: 1/2
    label:
      en: Title
      fr: Titre
    type: text
    required: true
  hideTitle:
    width: 1/2
    label:
      en: Hide title (use as aria-label only)
      fr: Masquer le titre (utilisé comme aria-label uniquement)
    type: toggle
    text:
      - en: Visible
        fr: Visible
      - en: Hidden
        fr: Masqué
    default: false
  steps:
    label:
      en: Steps
      fr: Étapes
    type: structure
    min: 1
    fields:
      title:
        label:
          en: Title
          fr: Titre
        type: text
        required: true
      shortDesc:
        label:
          en: Short description
          fr: Description courte
        extends: fields/writer
