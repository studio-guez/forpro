extends: blocks/base

name:
  en: Module - Cases
  fr: Module - Cases

icon: grid

fields:
  title:
    width: 1/2
    label:
      en: Title
      fr: Titre
    type: text
    required: true
  hideTitle:
    width: 1/2
    label:
      en: Hide title (use as aria-label only)
      fr: Masquer le titre (utilisé comme aria-label uniquement)
    type: toggle
    text: 
      - en: Visible
        fr: Visible
      - en: Hidden
        fr: Masqué
    default: false
  intro:
    label:
      en: Intro
      fr: Intro
    extends: fields/writer
  rows:
    label:
      en: Rows
      fr: Lignes
    type: structure
    min: 1
    fields:
      title:
        width: 1/2
        label:
          en: Title
          fr: Titre
        type: text
        required: true
      hideTitle:
        width: 1/2
        label:
          en: Hide title (use as aria-label only)
          fr: Masquer le titre (utilisé comme aria-label uniquement)
        type: toggle
        text: 
          - en: Visible
            fr: Visible
          - en: Hidden
            fr: Masqué
        default: false
      description:
        label:
          en: Description
          fr: Description
        extends: fields/writer
        required: true
      cta:
        extends: fields/cta
      media:
        label:
          en: Media (image or video)
          fr: Média (image ou vidéo)
        type: files
        min: 1
        required: true
        uploads: media
  layout:
    label:
      en: Layout
      fr: Disposition
    type: select
    default: alternate
    required: true
    options:
      - value: alternate
        text: { en: Alternate, fr: Alterné }
      - value: images-right
        text: { en: Images right, fr: Images à droite }
      - value: images-left
        text: { en: Images left, fr: Images à gauche }
  variant:
    extends: fields/variant
