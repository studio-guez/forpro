extends: blocks/base

name:
  en: Module - Links
  fr: Module - Liens

icon: list-bullet

fields:
  title:
    width: 1/2
    label:
      en: Title
      fr: Titre
    type: text
    required: true
  subtitle:
    width: 1/2
    label:
      en: Subtitle
      fr: Sous-titre
    type: text
  links:
    extends: fields/cta
    label:
      en: Links
      fr: Liens
    max: ~
  variant:
    width: 1/2
    label:
      en: Theme variant
      fr: Variante du thème
    type: select
    default: default
    required: true
    options:
      - value: default
        text: { en: Default, fr: Défaut }
      - value: inverted
        text: { en: Inverted, fr: Inversé }
      - value: backgroundImage
        text: { en: Background image, fr: Image de fond }
  backgroundImage:
    width: 1/2
    label:
      en: Background image
      fr: Image de fond
    type: files
    uploads: image
    max: 1
    required: true
    when:
      variant: backgroundImage
