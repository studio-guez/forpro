title:
  en: Lottie animation
  fr: Animation Lottie

# A `.lottie` is a zip archive, so a mime rule would let any archive through.
accept:
  extension:
    - json
    - lottie

fields:
  highContrast:
    extends: fields/highContrast
    label:
      en: High contrast animation
      fr: Animation contraste élevé
    help:
      en: Played instead of this animation when high-contrast mode is on.
      fr: Jouée à la place de cette animation en mode contraste élevé.
    query: file.siblings.template("high-contrast-animation")
    uploads:
      template: high-contrast-animation
  alt:
    label:
      en: Alternative text
      fr: Texte alternatif
    type: text
    help:
      en: What the animation shows, for screen readers. Leave empty if it is purely decorative.
      fr: Ce que montre l'animation, pour les lecteurs d'écran. Laisser vide si elle est purement décorative.
