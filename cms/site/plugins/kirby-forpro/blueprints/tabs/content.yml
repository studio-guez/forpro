label:
  en: Content
  fr: Contenu

icon: text
preset: page
pages: false

fields:

  hero:
    type: structure
    label:
      en: Hero
      fr: Image d'entête
    fields:

      text:
        type: text
        label:
          en: Text
          fr: Texte

      backGroundColor:
        label:
          en: Background color
          fr: Couleur de fond
        type: color
        default: '#ffffff'
        width: 1/2

      textColor:
        label:
          en: Text color
          fr: Couleur du texte
        type: color
        default: '#000000'
        width: 1/2

  showMenu:
    type: toggle
    label:
      en: Show menu
      fr: Afficher dans le menu
    width: 1/2

  showNewsletter:
    type: toggle
    label:
      en: Show newsletter
      fr: Afficher la newsletter
    width: 1/2

  body:
    type: blocks
    label:
      en: Content
      fr: Contenu
    fieldsets:
      - cta
      - animated-list
      - quote
      - body
      - capsule
      - cards
      - profiles
      - map
      - appointment
      - code
      image:
        extends: blocks/image
        fields:
          location: false
          caption: false
          link: false
          ratio: false
          crop: false
      video:
          extends: blocks/video
          fields:
            caption: false
      - dropdown
      - cards-focus
      - list
      - google-maps
