label:
  en: Content
  fr: Contenu

icon: text
pages: false

fields:

  hero:
    type: structure
    max: 1
    label:
      en: Hero
      fr: Header
    fields:

      text:
        type: text
        label:
          en: Text
          fr: Texte

      backGroundColor:
        label:
          en: Background color
          fr: Couleur de fond
        type: color
        default: '#ffffff'
        width: 1/2

      textColor:
        label:
          en: Text color
          fr: Couleur du texte
        type: color
        default: '#000000'
        width: 1/2

  showMenu:
    type: toggle
    label:
      en: Show menu
      fr: Afficher dans le menu
    width: 1/2

  showNewsletter:
    type: toggle
    label:
      en: Show newsletter
      fr: Afficher la newsletter
    width: 1/2

  body:
    type: blocks
    label:
      en: Content
      fr: Contenu
    fieldsets:
      - cta
      - animated-list
      - quote
      - capsules
      - cards
      - profiles
      - map
      - appointment
      - code
      image:
        extends: blocks/image
        fields:
          location: false
          caption: false
          link: false
          ratio: false
          crop: false
          image:
            when: false
          fixed:
            label:
              en: fixed
              fr: fixe
            type: radio
            columns: 2
            default: "true"
            options:
              true:
                en: 'yes'
                fr: 'oui'
              false:
                en: 'no'
                fr: 'non'

      video:
          extends: blocks/video
          fields:
            caption: false
      - body
      - list
      - dropdown
      - cards-focus
      - google-maps
