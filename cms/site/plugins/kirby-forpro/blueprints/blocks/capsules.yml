title:
  en: Graphics Capsules
  fr: Capsules Graphiques
icon: brush

preview: fields
wysiwyg: true

fields:

  capsules:
    label:
      fr: Liste de capsules
      en: Capsules list
    type: structure
    fields:
      style:
        label:
          en: Style
          fr: Style
        type: select
        default: style1
        options:
          style1: Style 1
          style2: Style 2
          style3: Style 3
          style4: Style 4


      title:
        label:
          en: Title
          fr: Titre
        type: text
        maxlength: 25

      text:
        label:
          en: Text
          fr: Texte
        type: writer
        nodes: false
        marks:
          - bold
          - italic
          - underline
          - link
        maxlength: 100

      image:
        label:
          en: Image
          fr: Image
        type: files
        max: 1
