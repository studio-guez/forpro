title:
  en: Map
  fr: Plan

icon: map

preview: fields
wysiwyg: true

fields:

  style:
    label:
      fr: Styles
      en: Styles
    type: select
    default: style2
    required: true
    options:
      style2: Sans les infos
      style3: Avec les infos




  section_popup_content:
    width: 1/2
    label: PopUp
    type: writer
    nodes:
      - bulletList
      - paragraph
    marks:
      - bold
      - link
    when:
      style: style3
  section_popup_button_custom_text:
    width: 1/4
    label: PopUp - text "En savoir plus"
    type: text
    when:
      style: style3
  section_popup_button_url:
    width: 1/4
    label: PopUp - lien
    type: url
    when:
      style: style3




