title:
  en: CTA
  fr: CTA

icon: merge

preview: fields
wysiwyg: true

fields:

  image:
    label:
      fr: Image
      en: Image
    type: files
    max: 1

  text:
    label:
      fr: Texte
      en: Text
    type: text

  link:
    label:
      fr: Lien
      en: Link
    type: url

  backgroundColor:
    label:
      fr: Couleur de fond
      en: Background color
    type: color
    default: '#ffffff'
    width: 1/2

  textColor:
    label:
      fr: Couleur du texte
      en: Text color
    type: color
    default: '#000000'
    width: 1/2

  styles:
    label:
      fr: Styles
      en: Styles
    type: select
    default: style1
    options:
      style1: Style 1
      style2: Style 2
