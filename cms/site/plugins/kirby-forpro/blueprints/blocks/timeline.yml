title: timeline

icon: chart

wysiwyg: false
preview: fields

fields:

  items:
    label: Timeline items
    type: structure
    min: 1
    fields:
      title:
        label: titre
        type: writer
        inline: true
        marks:
          - italic
      date:
        width: 1/2
        label: date de début
        type: date
      dateEnd:
        width: 1/2
        label: date de fin
        type: date
        help: si pas remplie, rien ne s'affiche
      dateMessage:
        label: message à la place de la ou des dates
        type: text
        help: si remplie, ce message s'affichera à la place de la ou les dates précédentes
      details:
        label: 'détails liée au dates (ex: fini le…)'
        type: writer
        inline: true
        marks:
          - italic
          - link
        nodes:
          - paragraph
      content:
        label: contenu
        type: writer
        nodes:
          - paragraph
        marks:
          - italic
          - link
          - bold
      button_text:
        width: 1/2
        label: text du bouton 1
        help: si vide, plus d'information
        type: text
      button_link:
        width: 1/2
        label: lien du bouton 1
        type: url
        nodes:
          - paragraph
      button_second_text:
        width: 1/2
        label: text du bouton 2
        help: si vide, plus d'information
        type: text
      button_second_link:
        width: 1/2
        label: lien du bouton 2
        type: url
        nodes:
          - paragraph
