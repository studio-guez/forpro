; Custom PHP settings (memory_limit, upload_max_filesize, ...)

; Must match the container TZ env var — OS timezone is not reliably inherited by PHP.
date.timezone = Europe/Zurich

; Panel file uploads (PDFs and images in this project can be sizeable).
upload_max_filesize = 64M
post_max_size = 64M

memory_limit = 256M
max_execution_time = 300

; Do not expose the PHP version via the X-Powered-By header.
expose_php = Off

; Recompile changed files on every request so edits (bind mounts in dev,
; plugin updates via named volumes in prod) are always picked up.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
