services:

  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/etc/traefik/certs
      - traefik_config:/etc/traefik/config
    restart: unless-stopped

  # SvelteKit
  restaurant:
    build:
      context: ./restaurant
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - cms
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restaurant.rule=Host(`foodlab.for-pro.ch`)"
      - "traefik.http.routers.restaurant.entrypoints=web"
      - "traefik.http.services.restaurant.loadbalancer.server.port=3000"

  # SvelteKit
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - cms
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`www.for-pro.ch`) || Host(`for-pro.ch`)"
      - "traefik.http.routers.website.entrypoints=web"
      - "traefik.http.services.website.loadbalancer.server.port=3000"

  # Nuxt
  menu:
    build:
      context: ./menu
      dockerfile: Dockerfile.prod
      args:
        NUXT_PUBLIC_CMS_BASE_URL: https://api.for-pro.ch
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - cms
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.menu.rule=Host(`menus.for-pro.ch`)"
      - "traefik.http.routers.menu.entrypoints=web"
      - "traefik.http.services.menu.loadbalancer.server.port=3000"

  # Kirby CMS
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile.prod
    # Ne monter QUE l'état mutable : le code vient de l'image. Bind mounts (et non
    # volumes nommés) pour que le contenu reste rsyncable/sauvegardable depuis l'hôte.
    volumes:
      - ./cms/content:/var/www/html/content
      - ./cms/media:/var/www/html/media
      - ./cms/site/accounts:/var/www/html/site/accounts
      - ./cms/site/sessions:/var/www/html/site/sessions
      - ./cms/site/cache:/var/www/html/site/cache
      - ./cms/site/plugins/kirby-calendars/data:/var/www/html/site/plugins/kirby-calendars/data
      - ./cms/site/plugins/kirby-foodlab/data:/var/www/html/site/plugins/kirby-foodlab/data
      - ./cms/site/plugins/kirby-menu-du-jour/data:/var/www/html/site/plugins/kirby-menu-du-jour/data
    env_file:
      - ./cms/.env
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cms.rule=Host(`api.for-pro.ch`)"
      - "traefik.http.routers.cms.entrypoints=web"
      - "traefik.http.services.cms.loadbalancer.server.port=80"

volumes:
  traefik_certs:
  traefik_config: