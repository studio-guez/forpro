# Deployment stack (preprod & production).
#
# This file is shipped to the target server by the deploy workflow
# (.github/actions/deploy) and started from $DEPLOY_PATH/current/.
#
# - Images are pre-built by CI and pulled from GHCR — nothing is built here.
# - Every service publishes only on 127.0.0.1. TLS termination, hostname
#   routing and certificates are handled by the reverse proxy (nginx)
#   installed on the host, outside this project.
# - All mutable state lives under ${SHARED_PATH} on the host, outside any
#   release directory, so image rebuilds and rollbacks never touch it.
#
# Variables:
# - SHARED_PATH, *_IMAGE_TAG are exported by the deploy action.
# - *_HTTP_PORT come from ${SHARED_PATH}/deploy.env (passed via --env-file), and
#   can be overridden per environment by the {CMS,WEBSITE,RESTAURANT,MENU}_HTTP_PORT
#   GitHub Actions variables, which the deploy action exports.

services:

  # Kirby CMS
  cms:
    image: ghcr.io/studio-guez/forpro/cms:${CMS_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${CMS_HTTP_PORT:-8080}:80"
    # Ne monter QUE l'état mutable : le code vient de l'image. Bind mounts (et non
    # volumes nommés) pour que le contenu reste rsyncable/sauvegardable depuis l'hôte.
    volumes:
      - ${SHARED_PATH}/cms/content:/var/www/html/content
      - ${SHARED_PATH}/cms/media:/var/www/html/media
      - ${SHARED_PATH}/cms/site/accounts:/var/www/html/site/accounts
      - ${SHARED_PATH}/cms/site/sessions:/var/www/html/site/sessions
      - ${SHARED_PATH}/cms/site/cache:/var/www/html/site/cache
      - ${SHARED_PATH}/cms/site/plugins/kirby-foodlab/data:/var/www/html/site/plugins/kirby-foodlab/data
      - ${SHARED_PATH}/cms/site/plugins/kirby-menu-du-jour/data:/var/www/html/site/plugins/kirby-menu-du-jour/data
      # Kirby license file (added manually on first deploy or registered from the
      # Panel). File bind mount so it survives redeploys — the deploy action seeds
      # an empty file, otherwise Docker would create a directory in its place.
      - ${SHARED_PATH}/cms/site/config/.license:/var/www/html/site/config/.license
    env_file:
      - ${SHARED_PATH}/cms.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # SvelteKit
  website:
    image: ghcr.io/studio-guez/forpro/website:${WEBSITE_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${WEBSITE_HTTP_PORT:-8081}:3000"
    restart: unless-stopped
    depends_on:
      - cms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # SvelteKit
  restaurant:
    image: ghcr.io/studio-guez/forpro/restaurant:${RESTAURANT_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${RESTAURANT_HTTP_PORT:-8082}:3000"
    restart: unless-stopped
    depends_on:
      - cms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nuxt
  menu:
    image: ghcr.io/studio-guez/forpro/menu:${MENU_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${MENU_HTTP_PORT:-8083}:3000"
    restart: unless-stopped
    depends_on:
      - cms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
