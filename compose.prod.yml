# Shipped by .github/actions/deploy and started from $DEPLOY_PATH/current/.
# SHARED_PATH and *_IMAGE_TAG are exported by the deploy action; BIND_ADDRESS and *_HTTP_PORT come from ${SHARED_PATH}/deploy.env via --env-file.

services:

  cms:
    image: ghcr.io/studio-guez/forpro/cms:${CMS_IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CMS_HTTP_PORT:-8080}:80"
    # Ne monter que l'état mutable, en bind mounts (pas de volumes nommés) : le code vient de l'image.
    volumes:
      - ${SHARED_PATH}/cms/content:/var/www/html/content
      - ${SHARED_PATH}/cms/media:/var/www/html/media
      - ${SHARED_PATH}/cms/site/accounts:/var/www/html/site/accounts
      - ${SHARED_PATH}/cms/site/sessions:/var/www/html/site/sessions
      - ${SHARED_PATH}/cms/site/cache:/var/www/html/site/cache
      - ${SHARED_PATH}/cms/site/plugins/kirby-foodlab/data:/var/www/html/site/plugins/kirby-foodlab/data
      - ${SHARED_PATH}/cms/site/plugins/kirby-menu-du-jour/data:/var/www/html/site/plugins/kirby-menu-du-jour/data
      # The deploy action seeds an empty .license file; without it Docker would create a directory here.
      - ${SHARED_PATH}/cms/site/config/.license:/var/www/html/site/config/.license
    env_file:
      - ${SHARED_PATH}/cms.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  website:
    image: ghcr.io/studio-guez/forpro/website:${WEBSITE_IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBSITE_HTTP_PORT:-8081}:3000"
    environment:
      - CMS_INTERNAL_URL=http://cms
    restart: unless-stopped
    depends_on:
      - cms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  restaurant:
    image: ghcr.io/studio-guez/forpro/restaurant:${RESTAURANT_IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RESTAURANT_HTTP_PORT:-8082}:3000"
    volumes:
      - ${SHARED_PATH}/restaurant/robots.txt:/app/build/client/robots.txt
    environment:
      - CMS_INTERNAL_URL=http://cms
    restart: unless-stopped
    depends_on:
      - cms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  menu:
    image: ghcr.io/studio-guez/forpro/menu:${MENU_IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MENU_HTTP_PORT:-8083}:3000"
    volumes:
      - ${SHARED_PATH}/menu/robots.txt:/app/.output/public/robots.txt
    restart: unless-stopped
    depends_on:
      - cms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
